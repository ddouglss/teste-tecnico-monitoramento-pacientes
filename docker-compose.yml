services:
  db:
    image: mysql:8.0
    container_name: healthgo_db
    restart: always
    environment:
      MYSQL_DATABASE: healthgo
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
      MYSQL_ROOT_PASSWORD: admin123
      TZ: UTC
    ports:
      - "3307:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql

  backend:
    build: .
    container_name: healthgo_backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/healthgo?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
    ports:
      - "8080:8080"
    depends_on:
      - db

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: healthgo_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - db
